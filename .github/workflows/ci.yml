name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # Pillow 仅供测试生成样例图片（run_tests.sh 环境自检会 import PIL）
          python -m pip install Pillow
          python -m pip install -e book2md

      - name: 单元测试（73 例，纯本地）
        working-directory: book2md
        run: bash run_tests.sh

      - name: 命令入口可用
        run: b2m --version

  test-book2qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" onnxruntime \
            tokenizers numpy matplotlib openpyxl httpx
          python -m pip install -e book2qa

      - name: 单元测试（154 例；真实语料类自动 skip）
        working-directory: book2qa
        env:
          B2Q_WORKSPACE: ${{ github.workspace }}/book2qa
        run: python -m unittest discover -s tests -q

      - name: 命令入口可用
        run: b2q --version
