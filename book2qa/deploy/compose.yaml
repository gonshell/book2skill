# 运行时编排（部署脚本生成/填充 TAG 与 BOOK2QA_HOME；API key 走 deploy.env）
# 语义约定：B2Q_WORKSPACE = 数据根（其下有 data/）；models/src 为只读依赖
services:
  serve:
    image: b2q-serve:${TAG}
    container_name: b2q-serve
    ports:
      - "8100:8100"
    volumes:
      - ${BOOK2QA_HOME}/data:/srv/workspace/data
      - ${BOOK2QA_HOME}/models:/srv/models:ro
      - ${BOOK2QA_HOME}/backup:/srv/backup
      - ${BOOK2QA_HOME}/src:/srv/src:ro
    environment:
      - B2Q_API_KEY=${B2Q_API_KEY}
      - B2Q_WORKSPACE=/srv/workspace
      - B2Q_MODELS_DIR=/srv/models/bge-onnx
      - B2Q_SOURCE_ROOT=/srv/src
    env_file:
      - deploy.env
    restart: unless-stopped
