[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-pipe"
version = "0.0.1"
description = "教材 PDF → md+图片+公式 → 双版本单体 HTML 的独立转换工具"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
tbp = "textbook_pipe.cli:main"
tbpipe = "textbook_pipe.cli:main"   # 过渡期别名（Q5 定稿：C 方案）

[project.optional-dependencies]
extract = ["pymupdf"]   # 仅本地读 PDF 页数用（远程抽取时不装亦可）

[tool.setuptools.packages.find]
include = ["textbook_pipe*"]
