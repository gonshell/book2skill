[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book2md"
version = "0.3.0"
description = "教材 PDF → md+图片+公式 → 双版本单体 HTML 的独立转换工具"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
b2m = "book2md.cli:main"

[project.optional-dependencies]
extract = ["pymupdf"]   # 仅本地读 PDF 页数用（远程抽取时不装亦可）

[tool.setuptools.packages.find]
include = ["book2md*"]

# KaTeX 0.16.11 资产随包分发（docs/install.md 锁定表）——缺此段 wheel 安装后渲染不可用
[tool.setuptools.package-data]
book2md = ["assets/*.js", "assets/katex/*", "assets/katex/fonts/*"]
